name: 💡 Feature request / 功能建议
description: Suggest a new feature or an improvement / 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        mind-map-zen is maintained in spare time and values a focused, minimal feature set — not every request will be accepted, but well-argued ones always get read.
        mind-map-zen 由个人业余维护,功能取舍偏克制——建议未必都被采纳,但说清动机的一定会认真读。
  - type: textarea
    id: problem
    attributes:
      label: The problem / 想解决的问题
      description: What are you trying to do that is awkward today? / 现在做什么事情觉得别扭、绕远?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 期望的方案
      description: What should the app do? / 你期望应用怎么做?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
      description: Optional / 可选
