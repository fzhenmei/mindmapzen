# Dependabot:npm / cargo / github-actions 三生态每周检查。
# 分组策略:生产依赖、开发依赖各合一个 PR,减少零碎请求;
# simple-mind-map(引擎)与 vditor(深度定制集成)排除出分组,
# 升级时单独成 PR,便于逐个仔细验证。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
        exclude-patterns:
          - simple-mind-map
          - vditor
      development:
        dependency-type: "development"
    labels:
      - dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
