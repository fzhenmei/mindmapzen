# 质量门:与本地 Stop hook 同口径(lint + typecheck + guard:lines)。
# 刻意不跑 vitest(全量首跑有个别已知抖动)与 tauri build(需 RC.EXE,本机路径)。
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run guard:lines
