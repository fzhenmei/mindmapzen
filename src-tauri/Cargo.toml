[package]
# 包名即 bin 产物名：target/release/mind-map-zen.exe（此前 "app" 出的是 app.exe，
# 与 tauri.conf.json 的 productName 无关——后者只管 bundle 安装包内的命名）
name = "mind-map-zen"
version = "1.4.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# 窗口状态记忆（v2.15）：关闭时自动保存位置/尺寸/最大化态，重启恢复；
# maximized:true 只作为首次启动（无状态文件）的默认
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
trash = "5"
tokio = { version = "1.53.1", features = ["process", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[dev-dependencies]
# 契约测试起本地 mock server（TcpListener 手写 HTTP 响应）所需特性；与主依赖 tokio 特性并集生效
tokio = { version = "1.53.1", features = ["macros", "rt", "net", "io-util"] }

# 标题栏主题染色（DWM 染色命令 set_titlebar_colors 的 win32 绑定，仅 Windows 需要）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
