<!doctype html>
<html lang="%HTML_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    %HREFLANG%
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 防 FOUC:首帧前按系统偏好定主题(官网无手动切换,始终跟随系统)
      ;(function () {
        document.documentElement.dataset.theme = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light'
      })()
    </script>
    <script>
      // 语言自动检测(2026-09 i18n):仅根路径生效——浏览器语言非中文且用户无显式选择
      // (localStorage)时跳英文版;英文版页面不反向跳转,避免回路
      ;(function () {
        try {
          if (localStorage.getItem('zen-lang')) return
          if (location.pathname !== '/' && location.pathname !== '/index.html') return
          var n = (navigator.language || '').toLowerCase()
          if (n && n.indexOf('zh') !== 0) location.replace('/en/')
        } catch (e) {
          // localStorage 不可用(如隐私模式)时按当前语言继续,不阻断渲染
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
